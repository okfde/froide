{% load i18n %}
{% load breadcrumb_helper %}
{% if messages %}
    {% get_breadcrumbs view as view_breadcrumbs %}
    {# overlay: float over content below overlay breadcrumbs, see breadcrumb.scss #}
    <div class="container h-list g-3{% if overlay|default:view_breadcrumbs.overlay %} messages-overlay{% endif %}">
        {% for message in messages %}
            <div class="alert {% if message.tags == "error" %}alert-danger{% else %}alert-{{ message.tags }}{% endif %} show alert-dismissible"
                 role="alert">
                {{ message }}
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="{% translate 'Close' %}"></button>
            </div>
        {% endfor %}
    </div>
{% endif %}
