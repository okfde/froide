# Hooks for projects building on froide. Use them with:
#
#   - repo: https://github.com/okfde/froide
#     rev: <commit or tag>
#     hooks:
#       - id: django-blocktrans-trimmed
#       - id: gettext-named-placeholders
#       - id: makemessages-de
#
# The scripts only need a python3 on PATH; froide itself is not installed.
- id: django-blocktrans-trimmed
  name: Ensure blocktrans/blocktranslate use trimmed
  language: script
  entry: scripts/enforce_blocktrans_trimmed.py
  files: \.html$

- id: gettext-named-placeholders
  name: Ensure translatable strings use named placeholders
  language: script
  entry: scripts/enforce_named_placeholders.py
  files: \.py$

# Requires a `checkmessagesde` make target in the consuming project that
# regenerates the German .po files and fails on untranslated or fuzzy messages.
- id: makemessages-de
  name: Ensure German translations are up to date
  language: system
  entry: make checkmessagesde
  files: \.(py|html|txt|po)$
  pass_filenames: false
