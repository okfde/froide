repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        language: node
        files: \.(js|ts|vue)?$
        entry: pnpm lint
        args: [--no-warn-ignored]

  - repo: https://github.com/Riverside-Healthcare/djLint
    rev: v1.36.4
    hooks:
      - id: djlint-reformat-django
      - id: djlint-django
  - repo: local
    hooks:
      - id: django-blocktrans-trimmed
        name: Ensure blocktrans/blocktranslate use trimmed
        language: script
        entry: scripts/enforce_blocktrans_trimmed.py
        files: \.html$
      - id: gettext-named-placeholders
        name: Ensure translatable strings use named placeholders
        language: script
        entry: scripts/enforce_named_placeholders.py
        files: \.py$
      - id: makemessages-de
        name: Ensure German translations are up to date
        language: system
        entry: make checkmessagesde
        files: \.(py|html|txt|po)$
        pass_filenames: false
