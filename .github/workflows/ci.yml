name: Froide CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
      - uses: j178/prek-action@v3.1.1
        env:
          SKIP: checkmessages-de

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - name: Install system-level dependencies
        run: sudo apt-get update && sudo apt-get install libgdal-dev gdal-bin libmagic-dev libmagickwand-dev libpoppler-cpp-dev poppler-utils ghostscript gettext
      - name: Start services
        run: docker compose -f compose-dev.yaml up --wait
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - uses: pnpm/setup@v3
        with:
          cache: true
      - name: Install dependencies
        run: |
          uv sync
          playwright install --with-deps chromium
      - name: Check German translations are up to date
        if: matrix.python-version == '3.13'
        run: |
          make checkmessagesde
          git diff --exit-code -- '**/django.po'
      - name: Build frontend
        run: pnpm run build
      - name: Compile translations
        run: |
          python manage.py compilemessages -i node_modules -l de
      - name: Run tests
        run: |
          pytest -n auto --cov --cov-report= froide/
          coverage report --format=markdown >> $GITHUB_STEP_SUMMARY
        env:
          DATABASE_URL: postgis://postgres:postgres@localhost/froide
