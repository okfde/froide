# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      semver-minor-days: 7
      semver-patch-days: 3
    allow:
      update-types:
        - version-update:semver-patch
        - version-update:semver-minor
    groups:
      npm-dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: '@okfde/filingcabinet'
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      semver-minor-days: 7
      semver-patch-days: 3
    allow:
      update-types:
        - version-update:semver-patch
        - version-update:semver-minor
    groups:
      python-dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: django-filingcabinet
